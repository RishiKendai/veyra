name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Hand-written notes win: put them in .github/release-notes/<tag>.md (for example v0.1.1.md).
      # Without such a file the notes are generated from commit messages (see .goreleaser.yaml).
      - name: Choose release notes
        id: notes
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "args=release --clean --release-notes=$f" >> "$GITHUB_OUTPUT"
          else echo "args=release --clean" >> "$GITHUB_OUTPUT"; fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
